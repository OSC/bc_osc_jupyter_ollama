---
cluster:
  - "cardinal"
form:
  - auto_accounts
  - auto_modules_app_jupyter
  - auto_modules_ollama
  - mode
  - working_dir
  - ollama_models
  - global_job_type
  - global_enable_mem
  - global_num_cores
  - global_mem
  - bc_num_hours
  - global_gpus
  - global_gpu_type
  - global_enable_debug
  - bc_email_on_started
  - global_default_values
attributes:
  auto_modules_app_jupyter:
    label: "Jupyter version"
    default: false
  mode:
    widget: "radio"
    value: "1"
    options:
      - ["Jupyter Lab", "1"]
      - ["Jupyter Notebook", "0"]
  auto_modules_ollama:
    label: "Ollama version"
    default: false
  working_dir:
    widget: "path_selector"
    label: "Root Directory"
    show_hidden: false
    show_files: false   # Only display directories
    help: "Select your project directory; defaults to $HOME"
  ollama_models:
    widget: "path_selector"
    label: "Ollama Models Directory"
    show_hidden: false
    show_files: false
    help: "Select where to read/write models; Defaults to the unwritable public central model directory"
